          description: 'A refusal, as problem details.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
      x-panel-only: true
      description: "Served to the panel's own session only; refused to every credential."
  '/webhook-subscriptions/{webhook_subscription}/actions/test':
    post:
      operationId: webhook-subscriptions.test
      tags:
        - webhook-subscriptions
      summary: 'Webhook Subscriptions: test'
      security:
        - administratorCredential:
            - 'admin:webhook-subscriptions:test'
      parameters:
        - name: webhook_subscription
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: 'One key per intended write, 1 to 255 characters once unquoted and at most 512 on the wire; the same request sent again is answered as the first was.'
          schema:
            type: string
            minLength: 1
            maxLength: 512
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        200:
          description: "The action's answer."
          content:
            application/json:
              schema: { type: object }
        default:
          description: 'A refusal, as problem details.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
