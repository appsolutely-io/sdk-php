openapi: 3.1.0
info:
  title: 'Administrator API'
  version: v1
  description: "What an administrator credential may do on this site, operation by operation, each under its own scope. A machine holds only the secret of an endpoint it owns: the site's backend receives the signing secret of a webhook endpoint it registers and alone changes that endpoint, and an administrator credential never creates an endpoint or receives a secret."
servers:
  - url: /api/admin/v1
security:
