        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          description: 'Pages by number instead of by cursor; not sent with `limit` or `cursor`.'
          schema:
            type: integer
            minimum: 1
        - name: per_page
          in: query
          required: false
          description: 'Rows on a numbered page; only with `page`.'
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: total
          in: query
          required: false
          description: 'Counts the filtered rows as well, in either mode, at the cost of a count query.'
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: 'By cursor, one of: id, created_at. By page number, any of the listed columns.'
          schema:
            type: string
            enum:
              - id
              - created_at
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        200:
          description: 'One page of the list.'
          content:
            application/json:
              schema: { type: object, properties: { data: { type: array, items: { allOf: [{ $ref: '#/components/schemas/AdminApiAlert' }, { type: object, properties: { _permissions: { type: object, additionalProperties: { type: boolean }, description: "What the person may do with the row, by action. Answered to the panel's own session only, never to a credential." } } }] } }, next_cursor: { type: string, description: 'By cursor: absent on the last page.' }, page: { type: integer, description: 'By page number: the page answered.' }, per_page: { type: integer, description: 'By page number: the rows a page holds.' }, next_page: { type: integer, description: 'By page number: absent on the last page.' }, total: { type: integer, description: 'The filtered rows, when `total` was asked for.' } }, required: [data] }
