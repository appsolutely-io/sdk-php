openapi: 3.1.0
info:
  title: 'Laravel public API'
  version: v1
  description: 'The public developer API of this install, major version v1 (current). Every path here is stable for the life of the version: fields are added, never removed or retyped, and a breaking change arrives as a new version while this one keeps serving.'
servers:
  - url: /
tags:
  - name: account-states
  - name: articles
  - name: form-entries
  - name: magic-link
  - name: me
  - name: me-addresses
  - name: me-billing-entry
  - name: me-entitlements
  - name: me-orders
  - name: me-push-devices
  - name: me-referral
  - name: orders
  - name: pages
  - name: products
  - name: sync.articles
  - name: sync.form-entries
  - name: sync.me-addresses
  - name: sync.me-orders
  - name: sync.orders
  - name: sync.pages
  - name: sync.products
  - name: version
  - name: webhook-deliveries
paths:
  /api/v1:
    get:
      operationId: getApiVersion
      tags:
        - version
      summary: 'The lifecycle of this API version'
      responses:
        200:
          description: 'One record'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiVersion' }
        429:
          description: 'The rate-limit budget for this window is spent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/account-states:
    get:
      operationId: listAccountStates
      tags:
        - account-states
      summary: 'List account states'
      parameters:
        - name: 'subjects[]'
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
              maxLength: 191
            minItems: 1
            maxItems: 100
          style: form
          explode: true
      responses:
        200:
          description: 'A page of records'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountStatePage' }
        401:
          description: 'The token is missing, malformed or expired'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        403:
          description: 'The token lacks the ability this endpoint requires'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        422:
          description: "The mode of money is the credential's: a live credential reads and writes live money, a test credential test money. Send the request without `mode`. Or: The request did not pass validation."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        429:
          description: 'The rate-limit budget for this window is spent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
      security:
        - bearerAuth: []
  /api/v1/articles:
    get:
      operationId: listArticles
      tags:
        - articles
      summary: 'List articles'
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 4096
        - name: sort
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
        - name: order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
      responses:
        200:
          description: 'A page of records'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArticlePage' }
        401:
          description: 'The token is missing, malformed or expired'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        403:
          description: 'The token lacks the ability this endpoint requires'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        422:
          description: "The mode of money is the credential's: a live credential reads and writes live money, a test credential test money. Send the request without `mode`. Or: The request did not pass validation."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        429:
          description: 'The rate-limit budget for this window is spent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
      security:
        - bearerAuth: []
    post:
      operationId: createArticle
      tags:
        - articles
      summary: 'Create one of articles'
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: 'Send a fresh key per operation and the same key with every retry of it: a retry is answered with the first answer instead of running again.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x20-\x7E]+$'
      responses:
        201:
          description: 'The record created'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Article' }
          headers:
            Location:
              description: 'Where the created resource is read back.'
              schema: { type: string, format: uri }
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
        400:
          description: 'An Idempotency-Key is 1 to 255 printable ASCII characters.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        401:
          description: 'The token is missing, malformed or expired'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        403:
          description: 'The token lacks the ability this endpoint requires'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        409:
          description: 'The request first sent with this Idempotency-Key has not finished; retry after it has.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
          headers:
            Retry-After:
              description: 'Sent only with the refusal of a request whose first attempt with this `Idempotency-Key` has not finished: how many seconds to wait before retrying.'
              schema: { type: integer, minimum: 1 }
        422:
          description: "The mode of money is the credential's: a live credential reads and writes live money, a test credential test money. Send the request without `mode`. Or: The request did not pass validation. Or: This Idempotency-Key was sent with a different request."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        429:
          description: 'The rate-limit budget for this window is spent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        500:
          description: 'The outcome is unknown; read the current state, then retry with a new key.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
          headers:
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreArticlePayload'
      security:
        - bearerAuth: []
