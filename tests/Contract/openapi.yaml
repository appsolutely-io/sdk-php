  '/api/v1/webhook-subscriptions/{subscription}/deliveries/{event}/redeliver':
    post:
      operationId: redeliverWebhookDelivery
      tags:
        - webhook-deliveries
      summary: 'Redeliver webhook deliveries'
      parameters:
        - name: subscription
          in: path
          required: true
          schema:
            type: string
        - name: event
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: 'Send a fresh key per operation and the same key with every retry of it: a retry is answered with the first answer instead of running again.'
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: '^[\x20-\x7E]+$'
      responses:
        202:
          description: 'One record'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookDelivery' }
          headers:
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
        400:
          description: 'An Idempotency-Key is 1 to 255 printable ASCII characters.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        401:
          description: 'The token is missing, malformed or expired'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        403:
          description: 'The token lacks the ability this endpoint requires'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        404:
          description: 'Not found.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
          headers:
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
        409:
          description: 'The webhook subscription is inactive. Or: The request first sent with this Idempotency-Key has not finished; retry after it has.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
          headers:
            Retry-After:
              description: 'Sent only with the refusal of a request whose first attempt with this `Idempotency-Key` has not finished: how many seconds to wait before retrying.'
              schema: { type: integer, minimum: 1 }
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
        422:
          description: "The mode of money is the credential's: a live credential reads and writes live money, a test credential test money. Send the request without `mode`. Or: This Idempotency-Key was sent with a different request."
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        429:
          description: 'The rate-limit budget for this window is spent'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        500:
          description: 'The outcome is unknown; read the current state, then retry with a new key.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
          headers:
            Idempotent-Replayed:
              description: 'Sent, as `true`, only when this is the stored answer to an earlier request with the same `Idempotency-Key`, given instead of running it again.'
              schema: { type: string, enum: ['true'] }
      security:
        - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    AccountState:
      type: object
      properties:
        subject:
          type: string
        sequence:
          type: integer
        status:
          type: string
        email:
          oneOf:
            - type: string
            - type: 'null'
        email_verified:
          type: boolean
        entitlements:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        totals:
          description: 'Each entitlement key with the quantity the account holds of it.'
          type: object
          additionalProperties: true
      required:
        - subject
        - sequence
        - status
        - email_verified
        - entitlements
        - totals
    AccountStatePage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountState'
        next_cursor:
          type: string
          description: 'Send back unchanged as `cursor` for the next page. Absent on the last page.'
    ApiVersion:
      type: object
      properties:
        version:
          type: string
        status:
          type: string
        deprecation:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        sunset:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        successor:
          oneOf:
            - type: string
            - type: 'null'
        documentation:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - version
        - status
    Article:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
        description:
          oneOf:
            - type: string
            - type: 'null'
        keywords:
          oneOf:
            - type: string
            - type: 'null'
        cover:
          description: 'The absolute URL the image is served at, built when the response is made, so it follows the address the site has then.'
          oneOf:
            - type: string
            - type: 'null'
        status:
          type: integer
        sort:
          oneOf:
            - type: integer
            - type: 'null'
        published_at:
          type: string
          format: date-time
        expired_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ArticleCategorySummary'
      required:
        - id
        - title
        - status
        - published_at
        - created_at
        - updated_at
        - categories
    ArticleCategorySummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - id
        - title
    ArticlePage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        next_cursor:
          type: string
          description: 'Send back unchanged as `cursor` for the next page. Absent on the last page.'
    ArticleSyncPull:
      type: object
      properties:
        upserts:
          type: array
          items:
            $ref: '#/components/schemas/Article'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
          type: string
          description: 'The watermark to pull from next time, sent on every page, the last included.'
        has_more:
          type: boolean
      required:
        - upserts
        - tombstones
        - next_cursor
        - has_more
    ArticleSyncPush:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSyncResult'
      required:
        - results
    ArticleSyncResult:
      type: object
      properties:
        mutation_id:
          type: string
        id:
          oneOf:
            - type: string
            - type: 'null'
        applied:
          type: boolean
        reason:
          oneOf:
            - type: string
            - type: 'null'
        errors:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        server_record:
          oneOf:
            - $ref: '#/components/schemas/Article'
            - type: 'null'
      required:
        - mutation_id
        - applied
    BillingEntry:
      type: object
      properties:
        available:
          type: boolean
        wording:
          description: 'The label to show, in the request locale; sent only when available.'
          oneOf:
            - type: string
            - type: 'null'
        presentation:
          description: 'How the store rules require the app to open the address; sent only when available.'
          oneOf:
            - type: string
            - type: 'null'
        needs_store_token:
          description: 'Whether opening the address needs the token the store hands the app for it, because the store is told of each opening; sent only when available.'
          oneOf:
            - type: boolean
            - type: 'null'
        url:
          description: 'The address to open; sent only when available.'
          oneOf:
            - type: string
            - type: 'null'
        expires_at:
          description: 'When a single-use address stops opening; null when the address is fixed. Sent only when available.'
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - available
    Entitlement:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        quantity:
          type: integer
        expires_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - key
        - label
        - quantity
    EntitlementPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Entitlement'
        next_cursor:
          type: string
          description: 'Send back unchanged as `cursor` for the next page. Absent on the last page.'
    FormEntry:
      type: object
      properties:
        id:
          type: string
        form_slug:
          oneOf:
            - type: string
            - type: 'null'
        name:
          oneOf:
            - type: string
            - type: 'null'
        first_name:
          oneOf:
            - type: string
            - type: 'null'
        last_name:
          oneOf:
            - type: string
            - type: 'null'
        email:
          oneOf:
            - type: string
            - type: 'null'
        mobile:
          oneOf:
            - type: string
            - type: 'null'
        data:
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        is_spam:
          type: boolean
        submitted_at:
          type: string
          format: date-time
        created_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        updated_at:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - id
        - is_spam
        - submitted_at
    FormEntryPage:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FormEntry'
        next_cursor:
          type: string
          description: 'Send back unchanged as `cursor` for the next page. Absent on the last page.'
    FormEntrySyncPull:
      type: object
      properties:
        upserts:
          type: array
          items:
            $ref: '#/components/schemas/FormEntry'
        tombstones:
          type: array
          items:
            $ref: '#/components/schemas/SyncTombstone'
        next_cursor:
